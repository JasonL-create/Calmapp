<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Still — To-do Prototype</title>
<style>
  :root{
    --bg:#f8f8f6;
    --surface:#ffffff;
    --text:#252724;
    --muted:#7a7e78;
    --line:#e8e9e5;
    --line-strong:#d8dad5;
    --accent:#5f7468;
    --accent-soft:#eef2ef;
    --shadow:0 10px 35px rgba(35,40,36,.05);
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height:1.4;
  }
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app{max-width:980px;margin:0 auto;padding:44px 26px 80px}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
  .brand h1{margin:0;font-size:30px;font-weight:650;letter-spacing:-.03em}
  .brand p{margin:5px 0 0;color:var(--muted);font-size:14px}
  .search-wrap{width:min(390px,46vw);position:relative}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
  .search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px 11px 40px;outline:none;color:var(--text)}
  .search:focus,.new-task-input:focus,.subtask-input:focus,.date-input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(95,116,104,.08)}
  .composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;display:flex;gap:10px;box-shadow:var(--shadow);margin-bottom:22px}
  .new-task-input{flex:1;border:0;outline:0;padding:8px 10px;font-size:17px;background:transparent}
  .add-btn{border:0;border-radius:10px;background:var(--accent);color:white;padding:10px 18px;font-weight:600}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 2px 18px}
  .tabs{display:flex;gap:4px}
  .tab{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px}
  .tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tool-select{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:8px 32px 8px 10px;outline:none;max-width:180px}
  .count{font-size:13px;color:var(--muted);margin-right:5px}
  .tasks{display:flex;flex-direction:column;gap:10px}
  .task-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:0 2px 12px rgba(35,40,36,.025)}
  .task-card.search-completed{opacity:.82}
  .task-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
  .check{appearance:none;width:21px;height:21px;border:1.5px solid #b7bbb4;border-radius:6px;margin:2px 0 0;display:grid;place-content:center;background:#fff;transition:.15s}
  .check:checked{background:var(--accent);border-color:var(--accent)}
  .check:checked::after{content:"";width:8px;height:4px;border:2px solid white;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
  .task-title{font-size:16px;font-weight:540;word-break:break-word;min-width:0}
  .task-title.done{text-decoration:line-through;color:#92968f}
  .created{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:2px}
  .meta{margin:12px 0 0 33px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .meta-btn,.quiet-btn,.category-select{border:1px solid var(--line);background:#fbfbfa;color:#686d67;border-radius:9px;padding:6px 9px;font-size:12px}
  .meta-btn:hover,.quiet-btn:hover{border-color:var(--line-strong)}
  .due-chip{display:flex;align-items:center;gap:6px}
  .date-input{border:1px solid var(--line);background:#fbfbfa;color:#686d67;border-radius:9px;padding:5px 8px;font-size:12px;max-width:145px;outline:none}
  .due-label{color:var(--muted);font-size:12px}
  .subtasks{margin:15px 0 0 33px;border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:9px}
  .subtask{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:26px}
  .subtask .check{width:18px;height:18px;border-radius:5px;margin:0}
  .subtask-title{font-size:14px;color:#454944}
  .subtask-title.done{text-decoration:line-through;color:#9a9e98}
  .tiny-time{font-size:11px;color:#a0a49e;white-space:nowrap}
  .subtask-composer{margin-top:2px;display:flex;gap:7px}
  .subtask-input{min-width:0;flex:1;border:1px solid var(--line);background:#fbfbfa;border-radius:9px;padding:7px 9px;outline:none;font-size:13px}
  .subtask-add{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:12px;padding:6px}
  .hide-prompt{margin:15px 0 0 33px;background:var(--accent-soft);border-radius:10px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#4f6157;font-size:13px}
  .prompt-actions{display:flex;gap:6px}
  .prompt-actions button{border:0;border-radius:8px;padding:6px 9px;font-size:12px}
  .hide-confirm{background:var(--accent);color:white}
  .keep{background:transparent;color:#66746c}
  .completion-note{margin:10px 0 0 33px;color:var(--muted);font-size:12px}
  .empty{border:1px dashed var(--line-strong);border-radius:14px;padding:46px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}
  .empty strong{display:block;color:#565a55;font-size:15px;margin-bottom:4px;font-weight:600}
  .modal-backdrop{position:fixed;inset:0;background:rgba(30,33,30,.18);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal-backdrop.open{display:flex}
  .modal{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 24px 70px rgba(25,30,26,.17)}
  .modal h2{font-size:18px;margin:0 0 6px}
  .modal p{font-size:13px;color:var(--muted);margin:0 0 14px}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .modal-actions button{border:0;border-radius:9px;padding:8px 11px}
  .cancel{background:#f2f3f0;color:#656963}
  .create{background:var(--accent);color:white}
  .status-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:10px;color:var(--muted);margin-left:7px;vertical-align:2px}
  .search-highlight{background:#e8eee9;color:inherit;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  @media (max-width:700px){
    .app{padding:28px 15px 60px}
    .topbar{align-items:stretch;flex-direction:column;gap:16px}
    .search-wrap{width:100%}
    .toolbar{align-items:stretch;flex-direction:column}
    .tools{justify-content:flex-start}
    .task-card{padding:15px 13px}
    .task-top{grid-template-columns:auto 1fr}.created{grid-column:2;margin-top:3px}
    .meta,.subtasks,.hide-prompt,.completion-note{margin-left:32px}
    .subtask{grid-template-columns:auto 1fr}.tiny-time{grid-column:2}
  }
</style>

<style id="tasks-section-divider-style">
.tasks-section-divider{margin:30px 0 16px;border-top:1px solid #d9ddd9;padding-top:16px}
.tasks-section-label{margin:0;font-size:11px;line-height:1;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8a918c}
@media(max-width:640px){.tasks-section-divider{margin-top:24px;padding-top:14px}}
</style>

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Still</h1>
      <p>A quiet place for what needs doing.</p>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.8-3.8"></path></svg>
      <input id="search" class="search" type="search" placeholder="Search all tasks, current or completed…" />
    </div>
  </header>

  <form id="newTaskForm" class="composer">
    <input id="newTask" class="new-task-input" autocomplete="off" placeholder="New task…" aria-label="New task" />
    <button class="add-btn" type="submit">Add</button>
  </form>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-view="current">Current</button>
      <button class="tab" data-view="completed">Completed</button>
    </div>
    <div class="tools">
      <span id="taskCount" class="count"></span>
      <select id="categoryFilter" class="tool-select" aria-label="Filter category">
        <option value="all">All categories</option>
        <option value="none">No category</option>
      </select>
      <select id="sortBy" class="tool-select" aria-label="Sort tasks">
        <option value="created-desc">Newest created</option>
        <option value="created-asc">Oldest created</option>
        <option value="category">Category</option>
        <option value="due">Due date</option>
        <option value="completed-desc">Recently completed</option>
      </select>
    </div>
  </div>

  <div class="tasks-section-divider"><p class="tasks-section-label">Tasks</p></div>
<main id="taskList" class="tasks"></main>
</div>

<div id="categoryModal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>Create category</h2>
    <p>Categories are optional. New tasks always start uncategorized.</p>
    <input id="categoryName" placeholder="Category name" maxlength="40" />
    <div class="modal-actions">
      <button id="cancelCategory" class="cancel" type="button">Cancel</button>
      <button id="createCategory" class="create" type="button">Create</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'still-todo-prototype-v1';
const seed = {
  categories:['Property Management','CVFC','Home'],
  tasks:[
    {id:crypto.randomUUID(),title:'Prepare fall registration',createdAt:new Date(Date.now()-1000*60*48).toISOString(),dueDate:'',category:'CVFC',parentComplete:false,parentCompletedAt:null,hidden:false,completedAt:null,subtasks:[
      {id:crypto.randomUUID(),title:'Update registration page',createdAt:new Date(Date.now()-1000*60*42).toISOString(),complete:true,completedAt:new Date(Date.now()-1000*60*18).toISOString()},
      {id:crypto.randomUUID(),title:'Email coaches',createdAt:new Date(Date.now()-1000*60*40).toISOString(),complete:false,completedAt:null},
      {id:crypto.randomUUID(),title:'Create Facebook post',createdAt:new Date(Date.now()-1000*60*37).toISOString(),complete:false,completedAt:null}
    ]},
    {id:crypto.randomUUID(),title:'Call landscaper about Maple St',createdAt:new Date(Date.now()-1000*60*12).toISOString(),dueDate:'',category:null,parentComplete:false,parentCompletedAt:null,hidden:false,completedAt:null,subtasks:[]}
  ]
};

let state = load();
let view = 'current';
let categoryTarget = null;

function load(){
  try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(parsed && parsed.tasks) return parsed;}catch(e){}
  localStorage.setItem(STORAGE_KEY,JSON.stringify(seed)); return structuredClone(seed);
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function escapeRegExp(s=''){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function highlight(s='',q=''){
  if(!q)return esc(s);
  const re=new RegExp(`(${escapeRegExp(q)})`,'ig');
  return String(s).split(re).map((part,i)=>i%2?`<mark class="search-highlight">${esc(part)}</mark>`:esc(part)).join('');
}
function fmt(iso){if(!iso)return ''; return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(iso));}
function fmtDate(date){if(!date)return ''; const [y,m,d]=date.split('-').map(Number); return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(y,m-1,d));}
function isFullyComplete(t){return t.parentComplete && t.subtasks.every(s=>s.complete);}
function findTask(id){return state.tasks.find(t=>t.id===id);}

function render(){
  renderFilters();
  const q=document.getElementById('search').value.trim().toLowerCase();
  const cat=document.getElementById('categoryFilter').value;
  const sort=document.getElementById('sortBy').value;
  let tasks=[...state.tasks];

  if(q){
    tasks=tasks.filter(t=>t.title.toLowerCase().includes(q)||t.subtasks.some(s=>s.title.toLowerCase().includes(q))||(t.category||'').toLowerCase().includes(q));
  }else{
    tasks=tasks.filter(t=>view==='current'?!t.hidden:t.hidden);
  }
  if(cat!=='all') tasks=tasks.filter(t=>cat==='none'?!t.category:t.category===cat);

  tasks.sort((a,b)=>{
    if(sort==='created-asc') return new Date(a.createdAt)-new Date(b.createdAt);
    if(sort==='category') return (a.category||'zzzz').localeCompare(b.category||'zzzz') || new Date(b.createdAt)-new Date(a.createdAt);
    if(sort==='due') return (a.dueDate||'9999-12-31').localeCompare(b.dueDate||'9999-12-31');
    if(sort==='completed-desc') return new Date(b.completedAt||0)-new Date(a.completedAt||0);
    return new Date(b.createdAt)-new Date(a.createdAt);
  });

  document.getElementById('taskCount').textContent=q?`${tasks.length} result${tasks.length===1?'':'s'}`:`${tasks.length} task${tasks.length===1?'':'s'}`;
  const list=document.getElementById('taskList');
  if(!tasks.length){
    list.innerHTML=`<div class="empty"><strong>${q?'No matching tasks':view==='current'?'Nothing needs your attention.':'No completed tasks yet.'}</strong>${q?'Try another search term.':view==='current'?'Add a task when something comes up.':'Finished tasks you hide will live here.'}</div>`;
    return;
  }
  list.innerHTML=tasks.map(t=>taskHtml(t,q)).join('');
  bindTaskEvents();
}

function taskHtml(t,q){
  const done=t.parentComplete;
  const fully=isFullyComplete(t);
  const catOptions=['<option value="">Category</option>',...state.categories.map(c=>`<option ${t.category===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`),'<option value="__create__">+ Create new…</option>'].join('');
  const searchStatus=q?`<span class="status-pill">${t.hidden?'Completed':'Current'}</span>`:'';
  return `<article class="task-card ${q&&t.hidden?'search-completed':''}" data-task="${t.id}">
    <div class="task-top">
      <input class="check parent-check" type="checkbox" ${done?'checked':''} aria-label="Complete task">
      <div class="task-title ${done?'done':''}">${highlight(t.title,q)}${searchStatus}</div>
      <div class="created">Created ${fmt(t.createdAt)}</div>
    </div>
    <div class="meta">
      <select class="category-select" aria-label="Category">${catOptions}</select>
      <span class="due-chip"><span class="due-label">Due</span><input class="date-input" type="date" value="${t.dueDate||''}" aria-label="Due date"></span>
      <button class="quiet-btn add-subtask-toggle" type="button">+ Create sub-task</button>
    </div>
    <div class="subtasks">
      ${t.subtasks.map(s=>`<div class="subtask" data-subtask="${s.id}">
        <input class="check sub-check" type="checkbox" ${s.complete?'checked':''} aria-label="Complete sub-task">
        <div class="subtask-title ${s.complete?'done':''}">${highlight(s.title,q)}</div>
        <div class="tiny-time">${s.complete?`Completed ${fmt(s.completedAt)}`:`Added ${fmt(s.createdAt)}`}</div>
      </div>`).join('')}
      <form class="subtask-composer" hidden><input class="subtask-input" placeholder="Sub-task…" autocomplete="off"><button class="subtask-add" type="submit">Add</button></form>
    </div>
    ${fully&&!t.hidden?`<div class="hide-prompt"><span>Everything is checked. <strong>Ready to hide?</strong></span><div class="prompt-actions"><button class="keep" type="button">Keep visible</button><button class="hide-confirm" type="button">Hide</button></div></div>`:''}
    ${t.hidden?`<div class="completion-note">Completed ${fmt(t.completedAt)} · Uncheck the task or any sub-task to return it to Current.</div>`:''}
  </article>`;
}

function renderFilters(){
  const sel=document.getElementById('categoryFilter'); const current=sel.value;
  sel.innerHTML='<option value="all">All categories</option><option value="none">No category</option>'+state.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if([...sel.options].some(o=>o.value===current))sel.value=current;
}

function bindTaskEvents(){
  document.querySelectorAll('.task-card').forEach(card=>{
    const id=card.dataset.task, t=findTask(id);
    card.querySelector('.parent-check').addEventListener('change',e=>{
      t.parentComplete=e.target.checked; t.parentCompletedAt=e.target.checked?new Date().toISOString():null;
      if(!e.target.checked && t.hidden){t.hidden=false;t.completedAt=null;view='current';setActiveTab();}
      save();render();
    });
    card.querySelector('.category-select').addEventListener('change',e=>{
      if(e.target.value==='__create__'){categoryTarget=id;openCategoryModal();e.target.value=t.category||'';}
      else {t.category=e.target.value||null;save();render();}
    });
    card.querySelector('.date-input').addEventListener('change',e=>{t.dueDate=e.target.value;save();render();});
    card.querySelector('.add-subtask-toggle').addEventListener('click',()=>{const f=card.querySelector('.subtask-composer');f.hidden=false;f.querySelector('input').focus();});
    card.querySelector('.subtask-composer').addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');const title=input.value.trim();if(!title)return;t.subtasks.push({id:crypto.randomUUID(),title,createdAt:new Date().toISOString(),complete:false,completedAt:null});input.value='';save();render();});
    card.querySelectorAll('.subtask').forEach(row=>row.querySelector('.sub-check').addEventListener('change',e=>{
      const s=t.subtasks.find(x=>x.id===row.dataset.subtask);s.complete=e.target.checked;s.completedAt=e.target.checked?new Date().toISOString():null;
      if(!e.target.checked && t.hidden){t.hidden=false;t.completedAt=null;view='current';setActiveTab();}
      save();render();
    }));
    const hide=card.querySelector('.hide-confirm');if(hide)hide.addEventListener('click',()=>{t.hidden=true;t.completedAt=new Date().toISOString();save();render();});
    const keep=card.querySelector('.keep');if(keep)keep.addEventListener('click',()=>{ /* intentionally remains visible */ });
  });
}

function setActiveTab(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}

document.getElementById('newTaskForm').addEventListener('submit',e=>{
  e.preventDefault();const input=document.getElementById('newTask');const title=input.value.trim();if(!title)return;
  state.tasks.unshift({id:crypto.randomUUID(),title,createdAt:new Date().toISOString(),dueDate:'',category:null,parentComplete:false,parentCompletedAt:null,hidden:false,completedAt:null,subtasks:[]});
  input.value='';view='current';setActiveTab();save();render();
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;setActiveTab();render();}));
document.getElementById('search').addEventListener('input',render);
document.getElementById('categoryFilter').addEventListener('change',render);
document.getElementById('sortBy').addEventListener('change',render);

function openCategoryModal(){document.getElementById('categoryModal').classList.add('open');const i=document.getElementById('categoryName');i.value='';setTimeout(()=>i.focus(),0)}
function closeCategoryModal(){document.getElementById('categoryModal').classList.remove('open');categoryTarget=null;}
document.getElementById('cancelCategory').addEventListener('click',closeCategoryModal);
document.getElementById('categoryModal').addEventListener('click',e=>{if(e.target.id==='categoryModal')closeCategoryModal();});
document.getElementById('createCategory').addEventListener('click',()=>{
  const input=document.getElementById('categoryName'), name=input.value.trim();if(!name)return;
  if(!state.categories.some(c=>c.toLowerCase()===name.toLowerCase()))state.categories.push(name);
  const t=findTask(categoryTarget);if(t)t.category=state.categories.find(c=>c.toLowerCase()===name.toLowerCase())||name;
  save();closeCategoryModal();render();
});
document.getElementById('categoryName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('createCategory').click();if(e.key==='Escape')closeCategoryModal();});
render();
</script>
</body>
</html>
